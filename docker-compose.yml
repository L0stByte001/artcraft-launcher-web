services:
  web:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      updater:
        condition: service_healthy
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./www:/usr/share/nginx/html:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    networks:
      - frontend

  updater:
    build:
      context: ./updater
      dockerfile: Dockerfile
    restart: unless-stopped
    user: "0:0"
    volumes:
      - ./www/apps:/opt/artcraft/www/apps
      - ./data:/opt/artcraft/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - frontend

networks:
  frontend:
    driver: bridge
